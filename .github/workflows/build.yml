name: Build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download toolchain
        shell: powershell
        run: scripts\bootstrap-windows.ps1
      - name: Build, test and package
        shell: powershell
        run: scripts\build-windows.ps1 -Package
      - uses: actions/upload-artifact@v4
        with:
          name: Fetcher-Windows
          path: build/windows/package/*.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libcurl4-openssl-dev
      - name: Build, test and package
        run: scripts/build-unix.sh --package
      - uses: actions/upload-artifact@v4
        with:
          name: Fetcher-Linux
          path: |
            build/linux/package/*.deb
            build/linux/package/*.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install ninja
      - name: Build, test and package
        run: scripts/build-unix.sh --package
      - uses: actions/upload-artifact@v4
        with:
          name: Fetcher-macOS
          path: build/darwin/package/*.dmg
